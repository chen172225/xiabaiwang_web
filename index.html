<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#f2eadb" /><title>瞎掰王 · 随机词语</title><style>:root{--ink:#18201d;--muted:#68706b;--paper:#f6f0e4;--paper-2:#eee4d2;--accent:#d84c35;--accent-dark:#a92e20;--green:#1e5a46;--line:rgba(24,32,29,.15);--shadow:0 28px 70px rgba(51,38,22,.18),0 8px 24px rgba(51,38,22,.10);}*{box-sizing:border-box;}html,body{min-height:100%;}body{margin:0;color:var(--ink);font-family:ui-serif,"Songti SC","STSong","Noto Serif CJK SC",serif;background:radial-gradient(circle at 14% 12%,rgba(216,76,53,.12),transparent 26rem),radial-gradient(circle at 88% 88%,rgba(30,90,70,.12),transparent 30rem),repeating-linear-gradient(0deg,rgba(65,49,30,.022) 0,rgba(65,49,30,.022) 1px,transparent 1px,transparent 4px),var(--paper);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));overflow-x:hidden;}.shell{width:min(720px,100%);display:grid;gap:20px;}header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 6px;}.brand{display:grid;gap:4px;}h1{margin:0;font-size:clamp(25px,5vw,38px);line-height:1;letter-spacing:.08em;font-weight:900;}.subtitle,.count{margin:0;color:var(--muted);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:13px;letter-spacing:.04em;}.count{border:1px solid var(--line);border-radius:999px;padding:7px 11px;white-space:nowrap;background:rgba(255,255,255,.32);}.stage{perspective:1400px;}.card{width:100%;aspect-ratio:4 / 3;min-height:390px;max-height:580px;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.72,.2,1);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;}.card.is-flipped{transform:rotateY(180deg);}.card .front,.card .back{transition:opacity .18s ease;}.card:not(.is-flipped) .front{opacity:1;pointer-events:auto;}.card:not(.is-flipped) .back{opacity:0;pointer-events:none;}.card.is-flipped .front{opacity:0;pointer-events:none;}.card.is-flipped .back{opacity:1;pointer-events:auto;}.card:focus-visible .face{box-shadow:var(--shadow),0 0 0 4px rgba(216,76,53,.26);}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;border-radius:26px;border:1px solid rgba(65,49,30,.17);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;padding:clamp(30px,7vw,64px);text-align:center;}.face::before{content:"";position:absolute;inset:14px;border:1px solid rgba(65,49,30,.22);border-radius:17px;pointer-events:none;}.face::after{content:"";position:absolute;inset:0;opacity:.3;pointer-events:none;background:repeating-linear-gradient(92deg,transparent 0 7px,rgba(82,59,32,.035) 7px 8px);}.front{transform:rotateY(0deg) translateZ(1px);background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.68),transparent 45%),var(--paper-2);}.back{transform:rotateY(180deg) translateZ(1px);color:#f7f1e5;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.075),transparent 43%),var(--green);border-color:rgba(255,255,255,.18);}.back::before{border-color:rgba(255,255,255,.28);}.face-content{position:relative;z-index:1;display:grid;justify-items:center;gap:22px;width:100%;}.eyebrow{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-dark);font-weight:800;}.back .eyebrow{color:#f4c8a2;}.word{margin:0;font-size:clamp(54px,12vw,100px);line-height:1.05;letter-spacing:.12em;text-indent:.12em;font-weight:900;text-wrap:balance;}.definition{margin:0;max-width:32em;font-size:clamp(19px,4vw,30px);line-height:1.7;letter-spacing:.04em;text-wrap:pretty;}.hint{position:absolute;z-index:2;bottom:28px;left:50%;transform:translateX(-50%);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.12em;white-space:nowrap;}.back .hint{color:rgba(247,241,229,.64);}.controls{display:grid;grid-template-columns:1fr;gap:12px;}button{appearance:none;border:0;border-radius:16px;min-height:58px;padding:14px 24px;font:800 17px/1 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:.08em;color:white;background:var(--accent);box-shadow:0 9px 0 var(--accent-dark),0 14px 28px rgba(169,46,32,.22);cursor:pointer;transition:transform .13s ease,box-shadow .13s ease,filter .13s ease;-webkit-tap-highlight-color:transparent;}button:hover{filter:brightness(1.035);transform:translateY(-1px);}button:active{transform:translateY(7px);box-shadow:0 2px 0 var(--accent-dark),0 5px 12px rgba(169,46,32,.18);}button:focus-visible{outline:4px solid rgba(216,76,53,.25);outline-offset:3px;}footer{text-align:center;color:var(--muted);font:12px/1.6 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;padding:2px 8px 0;}.swap-out .front .face-content,.swap-out .back .face-content{animation:swap .25s ease both;}@keyframes swap{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-8px) scale(.985);}}@media (max-width:520px){body{padding-left:14px;padding-right:14px;}.shell{gap:16px;}.card{min-height:430px;aspect-ratio:auto;}.face{padding:42px 27px 58px;border-radius:22px;}.word{font-size:clamp(48px,17vw,72px);}.definition{font-size:20px;line-height:1.75;}header{align-items:center;}.subtitle{display:none;}}@media (prefers-reduced-motion:reduce){.card,button{transition:none;}.swap-out .face-content{animation:none;}}</style></head><body><main class="shell"><header><div class="brand"><h1>瞎掰王</h1><p class="subtitle">真实冷知识题目；先瞎掰，再翻面看答案。</p></div><p class="count" id="count">真实词库</p></header><section class="stage" aria-live="polite"><div class="card" id="card" role="button" tabindex="0" aria-label="点击查看释义" aria-pressed="false"><article class="face front"><div class="face-content"><span class="eyebrow" id="kindFront">随机词语</span><h2 class="word" id="word">笑林廣記</h2></div><span class="hint">点击卡片 · 查看释义</span></article><article class="face back"><div class="face-content"><span class="eyebrow" id="kindBack">释义</span><p class="definition" id="definition"></p></div><span class="hint">再次点击 · 返回词语</span></article></div></section><div class="controls"><button id="next" type="button">换一个词</button></div><footer>词语取自公开桌游示例、节目实玩与真实冷知识；释义为独立整理。</footer></main><script>(()=>{'use strict';const dictionary=[{"word":"笑林廣記","kind":"古籍／笑話集","definition":"一部流傳甚廣的中國古代笑話集，內容多以短篇諷刺世情、官場與人性弱點；通行本常題為清代「遊戲主人」纂輯。"},{"word":"精靈馬","kind":"日本民俗","definition":"日本盂蘭盆節的祭祖供物。人們常把小黃瓜做成馬、茄子做成牛，象徵祖先乘馬快速回家，再乘牛慢慢離去。"},{"word":"笨蛋三文治","kind":"流行文化","definition":"源自 Gordon Ramsay 參與的一段電視惡搞短劇：他把兩片麵包夾在演員頭旁，問她是什麼，回答就是「笨蛋三文治」。"},{"word":"毒鵝膏","kind":"真菌／毒物","definition":"一種劇毒鵝膏菌，英文常稱 death cap。外觀並不特別嚇人，卻含有可造成嚴重肝損傷的毒素。"},{"word":"油鬼仔","kind":"馬來民間傳說","definition":"馬來文化中的神祕人物 Orang Minyak，傳說全身塗滿黑油，能在夜間潛入住宅並從追捕者手中滑脫。"},{"word":"天邊一朵雲","kind":"電影","definition":"蔡明亮執導的 2005 年臺灣電影，以乾旱、色情片拍攝與都市孤獨為背景，是其風格極鮮明的一部作品。"},{"word":"安藤百福","kind":"企業／飲食史","definition":"日清食品創辦人，被廣泛視為現代即食麵與杯麵的發明者。他出生於日治時期臺灣，後在日本發展食品事業。"},{"word":"抓大放小","kind":"經濟政策","definition":"中國國有企業改革中的政策概括：集中力量扶持大型國企，同時讓中小型國企改制、出售、兼併或更直接地面向市場。"},{"word":"鍵盤小妹","kind":"網路用語","definition":"臺灣網路社群中對「以年輕女性口吻或身分發文、但真實身分未必如此」的帳號或發文模式的戲稱。"},{"word":"普隆德拉","kind":"電子遊戲","definition":"線上遊戲《仙境傳說》中的王國首都與經典主城，是許多玩家最早接觸的交易、組隊和轉職中心。"},{"word":"法老之蛇","kind":"化學現象","definition":"一種燃燒後會迅速膨脹、長出蛇狀灰燼的化學展示或煙火。傳統配方可能含汞而危險，現代演示通常改用較安全材料。"},{"word":"香蕉戰爭","kind":"歷史","definition":"通常指 19 世紀末至 20 世紀初，美國在中美洲與加勒比地區進行的一系列軍事干預、占領與政治操控。"},{"word":"豐乳肥臀","kind":"文學","definition":"莫言的長篇小說，以一位母親及其龐大家族的命運，串連中國二十世紀的戰亂、政治與社會變遷。"},{"word":"魔鬼蛋","kind":"飲食","definition":"把水煮蛋切半，取出蛋黃後與美乃滋、芥末等調味，再填回蛋白中的冷盤，也常被稱為填餡蛋。"},{"word":"灰姑娘效應","kind":"心理學假說","definition":"演化心理學中的一個爭議概念，指統計上繼親家庭中的兒童受虐風險可能高於親生親子家庭。"},{"word":"天使抽稅","kind":"酒類／熟成","definition":"木桶熟成威士忌等酒類時，少量酒液會自然蒸發。業界常把這部分稱作「天使的分享」，像是被天使偷偷拿走。"},{"word":"大人買","kind":"消費文化","definition":"成年人憑自己的經濟能力，一次大量購買原本面向兒童或青少年的玩具、零食、漫畫等商品的消費方式。"},{"word":"收皮","kind":"粵語用語","definition":"香港粵語中的粗俗說法，可表示叫人閉嘴、住手、滾開或別再胡鬧；語氣通常很不客氣。"},{"word":"獅吼式","kind":"瑜伽","definition":"瑜伽體式 Simhasana。練習時張口、伸舌、睜眼並配合有力呼氣，外觀像獅子吼叫，因此得名。"},{"word":"廁所女神","kind":"歌曲／流行文化","definition":"日本歌手植村花菜的歌曲《トイレの神様》常見中文譯名。歌曲以祖母教導「把廁所打掃乾淨會變漂亮」的故事為主線。"},{"word":"4分33秒","kind":"實驗音樂","definition":"作曲家約翰・凱奇的作品。演奏者在三個樂章中不刻意演奏樂器，讓現場環境聲與聽眾反應成為作品內容。"},{"word":"金熊獎","kind":"電影獎項","definition":"柏林國際電影節的最高獎，頒給主競賽單元最佳影片；獎座以柏林城市象徵「熊」為造型。"},{"word":"伯特蘭・羅素","kind":"哲學／數理邏輯","definition":"英國哲學家、邏輯學家與數學家，分析哲學的重要奠基者之一，與懷特海合著《數學原理》。"},{"word":"索羅斯","kind":"金融／公共人物","definition":"喬治・索羅斯是匈牙利裔美國投資人與慈善家，以宏觀投資聞名，也透過開放社會基金會支持多地公民社會項目。"},{"word":"貪食蛇","kind":"電子遊戲","definition":"經典電子遊戲玩法：玩家控制不斷移動並逐漸變長的蛇吃下目標，同時避免撞到牆壁或自己的身體。"},{"word":"曼德拉效應","kind":"記憶現象","definition":"大量人對同一事件或細節產生相似但錯誤記憶的現象，名稱源自有人錯誤記得曼德拉早已在獄中去世。"},{"word":"光子力研究所","kind":"動畫設定","definition":"機器人動畫《無敵鐵金剛》系列中的研究機構，主角機器人與多項技術由此誕生；名稱常被誤記成相近說法。"},{"word":"死亡谷移動石","kind":"自然現象","definition":"美國死亡谷乾湖床上的石頭會留下長長移動痕跡。研究顯示，薄冰、積水與微風共同作用即可推動石塊。"},{"word":"鴨子曲線","kind":"能源系統","definition":"電網淨負載曲線因白天太陽能大量發電而下凹、傍晚需求快速上升而翹起，形狀像鴨子，因此得名。"},{"word":"紅皇后效應","kind":"演化／競爭","definition":"源自《愛麗絲鏡中奇遇》的比喻：生物或組織必須持續進步，才能在競爭環境中維持原本的相對位置。"},{"word":"黑天鵝事件","kind":"風險概念","definition":"事前極難預測、發生後影響巨大，而且人們往往會在事後拼出一套看似合理解釋的罕見事件。"}];const card=document.getElementById('card'),word=document.getElementById('word'),definition=document.getElementById('definition'),kindFront=document.getElementById('kindFront'),kindBack=document.getElementById('kindBack'),next=document.getElementById('next'),count=document.getElementById('count');count.textContent=`${dictionary.length.toLocaleString('zh-CN')} 个真实词条`;let bag=[],currentIndex=-1;function refillBag(){bag=Array.from({length:dictionary.length},(_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}if(bag.length>1&&bag[bag.length-1]===currentIndex)[bag[bag.length-1],bag[bag.length-2]]=[bag[bag.length-2],bag[bag.length-1]]}function showNext(){if(!bag.length)refillBag();card.classList.add('swap-out');setTimeout(()=>{currentIndex=bag.pop();const entry=dictionary[currentIndex];card.classList.remove('is-flipped');card.setAttribute('aria-pressed','false');card.setAttribute('aria-label',`词语：${entry.word}。点击查看释义`);word.textContent=entry.word;definition.textContent=entry.definition;kindFront.textContent=entry.kind;kindBack.textContent=`${entry.kind} · 释义`;card.classList.remove('swap-out')},180)}function flipCard(){const flipped=card.classList.toggle('is-flipped');card.setAttribute('aria-pressed',String(flipped));card.setAttribute('aria-label',flipped?'正在显示释义。再次点击返回词语':`词语：${word.textContent}。点击查看释义`)}card.addEventListener('click',flipCard);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}});next.addEventListener('click',showNext);document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='r'||event.key==='ArrowRight')showNext()});refillBag();showNext()})();</script></body></html>
