<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#f2eadb" /><title>瞎掰王 · 随机词语</title><style>:root{--ink:#18201d;--muted:#68706b;--paper:#f6f0e4;--paper-2:#eee4d2;--accent:#d84c35;--accent-dark:#a92e20;--green:#1e5a46;--line:rgba(24,32,29,.15);--shadow:0 28px 70px rgba(51,38,22,.18),0 8px 24px rgba(51,38,22,.10);}*{box-sizing:border-box;}html,body{min-height:100%;}body{margin:0;color:var(--ink);font-family:ui-serif,"Songti SC","STSong","Noto Serif CJK SC",serif;background:radial-gradient(circle at 14% 12%,rgba(216,76,53,.12),transparent 26rem),radial-gradient(circle at 88% 88%,rgba(30,90,70,.12),transparent 30rem),repeating-linear-gradient(0deg,rgba(65,49,30,.022) 0,rgba(65,49,30,.022) 1px,transparent 1px,transparent 4px),var(--paper);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));overflow-x:hidden;}.shell{width:min(720px,100%);display:grid;gap:20px;}header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 6px;}.brand{display:grid;gap:4px;}h1{margin:0;font-size:clamp(25px,5vw,38px);line-height:1;letter-spacing:.08em;font-weight:900;}.subtitle,.count{margin:0;color:var(--muted);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:13px;letter-spacing:.04em;}.count{border:1px solid var(--line);border-radius:999px;padding:7px 11px;white-space:nowrap;background:rgba(255,255,255,.32);}.stage{perspective:1400px;}.card{width:100%;aspect-ratio:4 / 3;min-height:390px;max-height:580px;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.72,.2,1);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;}.card.is-flipped{transform:rotateY(180deg);}.card .front,.card .back{transition:opacity .18s ease;}.card:not(.is-flipped) .front{opacity:1;pointer-events:auto;}.card:not(.is-flipped) .back{opacity:0;pointer-events:none;}.card.is-flipped .front{opacity:0;pointer-events:none;}.card.is-flipped .back{opacity:1;pointer-events:auto;}.card:focus-visible .face{box-shadow:var(--shadow),0 0 0 4px rgba(216,76,53,.26);}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;border-radius:26px;border:1px solid rgba(65,49,30,.17);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;padding:clamp(30px,7vw,64px);text-align:center;}.face::before{content:"";position:absolute;inset:14px;border:1px solid rgba(65,49,30,.22);border-radius:17px;pointer-events:none;}.face::after{content:"";position:absolute;inset:0;opacity:.3;pointer-events:none;background:repeating-linear-gradient(92deg,transparent 0 7px,rgba(82,59,32,.035) 7px 8px);}.front{transform:rotateY(0deg) translateZ(1px);background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.68),transparent 45%),var(--paper-2);}.back{transform:rotateY(180deg) translateZ(1px);color:#f7f1e5;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.075),transparent 43%),var(--green);border-color:rgba(255,255,255,.18);}.back::before{border-color:rgba(255,255,255,.28);}.face-content{position:relative;z-index:1;display:grid;justify-items:center;gap:22px;width:100%;}.eyebrow{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-dark);font-weight:800;}.back .eyebrow{color:#f4c8a2;}.word{margin:0;font-size:clamp(54px,12vw,100px);line-height:1.05;letter-spacing:.12em;text-indent:.12em;font-weight:900;text-wrap:balance;}.definition{margin:0;max-width:32em;font-size:clamp(19px,4vw,30px);line-height:1.7;letter-spacing:.04em;text-wrap:pretty;}.hint{position:absolute;z-index:2;bottom:28px;left:50%;transform:translateX(-50%);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.12em;white-space:nowrap;}.back .hint{color:rgba(247,241,229,.64);}.controls{display:grid;grid-template-columns:1fr;gap:12px;}button{appearance:none;border:0;border-radius:16px;min-height:58px;padding:14px 24px;font:800 17px/1 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:.08em;color:white;background:var(--accent);box-shadow:0 9px 0 var(--accent-dark),0 14px 28px rgba(169,46,32,.22);cursor:pointer;transition:transform .13s ease,box-shadow .13s ease,filter .13s ease;-webkit-tap-highlight-color:transparent;}button:hover{filter:brightness(1.035);transform:translateY(-1px);}button:active{transform:translateY(7px);box-shadow:0 2px 0 var(--accent-dark),0 5px 12px rgba(169,46,32,.18);}button:focus-visible{outline:4px solid rgba(216,76,53,.25);outline-offset:3px;}footer{text-align:center;color:var(--muted);font:12px/1.6 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;padding:2px 8px 0;}.swap-out .front .face-content,.swap-out .back .face-content{animation:swap .25s ease both;}@keyframes swap{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-8px) scale(.985);}}@media (max-width:520px){body{padding-left:14px;padding-right:14px;}.shell{gap:16px;}.card{min-height:430px;aspect-ratio:auto;}.face{padding:42px 27px 58px;border-radius:22px;}.word{font-size:clamp(48px,17vw,72px);}.definition{font-size:20px;line-height:1.75;}header{align-items:center;}.subtitle{display:none;}}@media (prefers-reduced-motion:reduce){.card,button{transition:none;}.swap-out .face-content{animation:none;}}</style></head><body><main class="shell"><header><div class="brand"><h1>瞎掰王</h1><p class="subtitle">仅收录公开可核对的《瞎掰王》真实题目。</p></div><p class="count" id="count">真实词库</p></header><section class="stage" aria-live="polite"><div class="card" id="card" role="button" tabindex="0" aria-label="点击查看释义" aria-pressed="false"><article class="face front"><div class="face-content"><span class="eyebrow" id="kindFront">随机词语</span><h2 class="word" id="word">加载中</h2></div><span class="hint">点击卡片 · 查看释义</span></article><article class="face back"><div class="face-content"><span class="eyebrow" id="kindBack">释义</span><p class="definition" id="definition"></p></div><span class="hint">再次点击 · 返回词语</span></article></div></section><div class="controls"><button id="next" type="button">换一个词</button></div><footer>题目来自官方展示、公开卡牌照片、题库转录与明确标注的实玩题单；释义独立整理。</footer></main><script src="authentic-1.js"></script><script src="authentic-2.js"></script><script src="authentic-3.js"></script><script src="authentic-4.js"></script><script>(()=>{'use strict';const dictionary=window.XBW_TERMS||[];const card=document.getElementById('card'),word=document.getElementById('word'),definition=document.getElementById('definition'),kindFront=document.getElementById('kindFront'),kindBack=document.getElementById('kindBack'),next=document.getElementById('next'),count=document.getElementById('count');count.textContent=`${dictionary.length.toLocaleString('zh-CN')} 个真实桌游题目`;let bag=[],currentIndex=-1;function refillBag(){bag=Array.from({length:dictionary.length},(_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}if(bag.length>1&&bag[bag.length-1]===currentIndex)[bag[bag.length-1],bag[bag.length-2]]=[bag[bag.length-2],bag[bag.length-1]]}function showNext(){if(!bag.length)refillBag();card.classList.add('swap-out');setTimeout(()=>{currentIndex=bag.pop();const entry=dictionary[currentIndex];card.classList.remove('is-flipped');card.setAttribute('aria-pressed','false');card.setAttribute('aria-label',`词语：${entry.word}。点击查看释义`);word.textContent=entry.word;definition.textContent=entry.definition;kindFront.textContent=entry.hint;kindBack.textContent=`${entry.kind} · 释义`;card.classList.remove('swap-out')},180)}function flipCard(){const flipped=card.classList.toggle('is-flipped');card.setAttribute('aria-pressed',String(flipped));card.setAttribute('aria-label',flipped?'正在显示释义。再次点击返回词语':`词语：${word.textContent}。点击查看释义`)}card.addEventListener('click',flipCard);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}});next.addEventListener('click',showNext);document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='r'||event.key==='ArrowRight')showNext()});refillBag();showNext()})();</script></body></html>
